<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="聚合搜索">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f5f7">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<link rel="manifest" href="manifest.json?v=2">
<title>聚合搜索</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --sub: #86868b;
    --line: rgba(0,0,0,.06);
    --shadow: 0 1px 3px rgba(0,0,0,.04);
    --radius: 16px;
    --xhs: #ff2442;
    --dy:  #111;
    --bili:#fb7299;
    --web: #0078d4;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --sub: #98989d;
      --line: rgba(255,255,255,.08);
      --shadow: 0 1px 3px rgba(0,0,0,.3);
      --dy: #f5f5f7;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { width: 100%; overflow-x: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 24px) 16px env(safe-area-inset-bottom, 24px);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.3s, color 0.3s;
  }

  .container {
    width: 100%;
    max-width: 480px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ── 头部 ── */
  .header {
    text-align: center;
    padding-top: 16px;
  }

  .logo { font-size: 40px; margin-bottom: 8px; }

  .title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--sub);
    margin-top: 4px;
  }

  /* ── 搜索框 ── */
  .search-wrap { position: relative; }

  .search-input {
    width: 100%;
    height: 56px;
    padding: 0 96px 0 20px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--text);
    font-size: 18px;
    outline: none;
    transition: border 0.25s, box-shadow 0.25s;
    box-shadow: var(--shadow);
  }

  .search-input::placeholder { color: var(--sub); }

  .search-input:focus {
    border-color: #0071e3;
    box-shadow: 0 0 0 4px rgba(0,113,227,.12);
  }

  .search-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    pointer-events: auto;
    cursor: pointer;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #0071e3;
    color: #fff;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s, transform 0.15s;
    z-index: 2;
  }

  .search-icon:active {
    transform: translateY(-50%) scale(0.9);
    opacity: 0.8;
  }

  .search-icon.loading {
    pointer-events: none;
    opacity: 0.6;
  }

  .search-clear {
    position: absolute;
    right: 54px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: var(--line);
    color: var(--sub);
    font-size: 14px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }

  .search-clear.show { display: flex; }
  .search-clear:active { background: rgba(0,0,0,.15); }

  /* ── 大按钮组 ── */
  .app-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .app-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 64px;
    padding: 16px 20px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--card);
    cursor: pointer;
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: var(--shadow);
    -webkit-tap-highlight-color: transparent;
  }

  .app-btn:active {
    transform: scale(0.97);
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
  }

  .app-btn-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    color: #fff;
  }

  .icon-xhs  { background: var(--xhs); }
  .icon-dy   { background: var(--dy);  }
  .icon-bili { background: var(--bili);}
  .icon-web  { background: var(--web); }

  .app-btn-label {
    display: flex;
    flex-direction: column;
    text-align: left;
  }

  .app-btn-name { font-weight: 600; line-height: 1.2; }

  .app-btn-hint {
    font-size: 12px;
    color: var(--sub);
    font-weight: 400;
  }

  .app-btn-arrow {
    margin-left: auto;
    color: var(--sub);
    font-size: 18px;
  }

  /* ── AI 推荐高亮 ── */
  .app-btn.highlight {
    border-color: #0071e3;
    box-shadow: 0 0 0 3px rgba(0,113,227,.2), 0 4px 16px rgba(0,113,227,.12);
    transform: scale(1.02);
    position: relative;
  }

  .app-btn.highlight::before {
    content: "🤖 推荐";
    position: absolute;
    top: -10px;
    right: 12px;
    background: #0071e3;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 10px;
    letter-spacing: 0.5px;
  }

  .app-btn.highlight .app-btn-arrow {
    color: #0071e3;
    font-weight: 700;
  }

  /* ── 安装横幅 ── */
  .install-banner {
    display: none;
    width: 100%;
    padding: 14px 16px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    text-align: center;
    font-size: 14px;
    color: var(--sub);
    line-height: 1.6;
  }

  .install-banner strong {
    color: #0071e3;
  }

  /* ── 历史 ── */
  .history {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .history-head span {
    font-size: 13px;
    font-weight: 600;
    color: var(--sub);
    letter-spacing: 0.5px;
  }

  .history-head button {
    font-size: 12px;
    color: var(--sub);
    background: none;
    border: none;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .history-head button:active { color: #ff3b30; }

  .history-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .history-tag {
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .history-tag:active {
    background: #0071e3;
    color: #fff;
    border-color: #0071e3;
  }

  .history-empty {
    font-size: 14px;
    color: var(--sub);
    text-align: center;
    padding: 12px 0;
    opacity: 0.5;
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--text);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── 底部 ── */
  .footer {
    text-align: center;
    font-size: 12px;
    color: var(--sub);
    opacity: 0.4;
    padding-top: 8px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">🔍</div>
    <div class="title">聚合搜索</div>
    <div class="subtitle">搜遍全网，一键直达</div>
  </div>

  <div class="search-wrap">
    <input
      type="text"
      class="search-input"
      id="searchInput"
      placeholder="输入关键词…"
      autofocus
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
    >
    <button class="search-clear" id="clearBtn">✕</button>
    <span class="search-icon" id="searchIcon">🔍</span>
  </div>

  <!-- 安装提示 -->
  <div class="install-banner" id="installBanner">
    💡 点击浏览器 <strong>分享 → 添加到主屏幕</strong>，即可像 App 一样使用
  </div>

  <div class="app-buttons">
    <button class="app-btn" data-platform="xhs">
      <span class="app-btn-icon icon-xhs">📕</span>
      <span class="app-btn-label">
        <span class="app-btn-name">小红书</span>
        <span class="app-btn-hint">在 App 或网页中搜索</span>
      </span>
      <span class="app-btn-arrow">›</span>
    </button>

    <button class="app-btn" data-platform="dy">
      <span class="app-btn-icon icon-dy">🎵</span>
      <span class="app-btn-label">
        <span class="app-btn-name">抖音</span>
        <span class="app-btn-hint">在 App 或网页中搜索</span>
      </span>
      <span class="app-btn-arrow">›</span>
    </button>

    <button class="app-btn" data-platform="bili">
      <span class="app-btn-icon icon-bili">📺</span>
      <span class="app-btn-label">
        <span class="app-btn-name">哔哩哔哩</span>
        <span class="app-btn-hint">在 App 或网页中搜索</span>
      </span>
      <span class="app-btn-arrow">›</span>
    </button>

    <button class="app-btn" data-platform="bing">
      <span class="app-btn-icon icon-web">🌐</span>
      <span class="app-btn-label">
        <span class="app-btn-name">网页搜索</span>
        <span class="app-btn-hint">使用必应搜索</span>
      </span>
      <span class="app-btn-arrow">›</span>
    </button>
  </div>

  <div class="history">
    <div class="history-head">
      <span>🕐 最近搜索</span>
      <button id="historyClear">清空</button>
    </div>
    <div class="history-tags" id="historyList"></div>
  </div>

  <div class="footer">添加到主屏幕，像 App 一样使用</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const MAX = 10;
  const KEY = 'search_history';
  // ============================================================
  // API 代理地址
  // 本地开发：http://localhost:3001/api/classify
  // 生产环境：替换为你的 Cloudflare Worker URL
  // ============================================================
  var API_PROXY = window.location.hostname === 'localhost'
    ? 'http://localhost:3001/api/classify'
    : 'https://search-app.yunjialiu0601.workers.dev/api/classify';

  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const searchIcon = document.getElementById('searchIcon');
  const historyList = document.getElementById('historyList');
  const historyClear = document.getElementById('historyClear');
  const banner = document.getElementById('installBanner');
  const toastEl = document.getElementById('toast');
  const appBtns = document.querySelectorAll('.app-btn');

  const PLATFORMS = {
    xhs:  { name: '小红书', scheme: kw => `xhsdiscover://search/result?keyword=${encodeURIComponent(kw)}`, web: kw => `https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(kw)}&source=web_search_result_notes` },
    dy:   { name: '抖音',   scheme: kw => `snssdk1128://search?keyword=${encodeURIComponent(kw)}`, web: kw => `https://www.douyin.com/search/${encodeURIComponent(kw)}` },
    bili: { name: '哔哩哔哩', scheme: kw => `bilibili://search/${encodeURIComponent(kw)}`, web: kw => `https://search.bilibili.com/all?keyword=${encodeURIComponent(kw)}` },
    bing: { name: '必应',   scheme: null, web: kw => `https://www.bing.com/search?q=${encodeURIComponent(kw)}` },
  };

  // AI 推荐的平台，默认 xhs
  var currentPlatform = 'xhs';

  const isPWA = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const isMobile = () => /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  // ── 历史 ──
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  const save = list => { localStorage.setItem(KEY, JSON.stringify(list.slice(0, MAX))); };

  function add(kw) {
    const word = kw.trim();
    if (!word) return;
    const list = load().filter(v => v !== word);
    list.unshift(word);
    save(list);
    render();
  }

  function clearAll() {
    localStorage.removeItem(KEY);
    render();
    toast('历史已清空');
  }

  function render() {
    const list = load();
    if (!list.length) {
      historyList.innerHTML = '<div class="history-empty">暂无搜索记录</div>';
      return;
    }
    historyList.innerHTML = list.map(kw =>
      `<span class="history-tag">${kw.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`
    ).join('');
    historyList.querySelectorAll('.history-tag').forEach((tag, i) => {
      tag.addEventListener('click', () => {
        input.value = list[i];
        input.focus();
        toggleClear();
        // 点击历史标签也触发 AI 分类
        classify(list[i]);
      });
    });
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._tid);
    toastEl._tid = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function toggleClear() {
    clearBtn.classList.toggle('show', !!input.value.trim());
  }

  // ── AI 平台推荐 ──
  function highlightPlatform(platformId) {
    currentPlatform = platformId;
    appBtns.forEach(function(btn) {
      btn.classList.toggle('highlight', btn.dataset.platform === platformId);
    });
  }

  var classifyTimer = null;
  var classifyBusy = false;

  async function classify(keyword) {
    var kw = (keyword || input.value).trim();
    if (!kw || kw.length < 1) {
      highlightPlatform('xhs');
      return;
    }

    if (classifyBusy) return;
    classifyBusy = true;
    searchIcon.classList.add('loading');

    try {
      var resp = await fetch(API_PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: kw }),
      });
      var data = await resp.json();
      if (data && PLATFORMS[data.platform]) {
        highlightPlatform(data.platform);
      } else {
        highlightPlatform('xhs');
      }
    } catch (err) {
      console.error('AI classify failed:', err);
      highlightPlatform('xhs');
    } finally {
      classifyBusy = false;
      searchIcon.classList.remove('loading');
    }
  }

  function debouncedClassify(keyword) {
    clearTimeout(classifyTimer);
    classifyTimer = setTimeout(function() {
      classify(keyword);
    }, 300);
  }

  // ── 跳转逻辑 ──
  function openUrl(url) {
    window.open(url, '_blank');
  }

  function openAppOrWeb(schemeUrl, webUrl) {
    if (!schemeUrl) { openUrl(webUrl); return; }
    var fallback = setTimeout(function () { openUrl(webUrl); }, 500);
    window.addEventListener('pagehide',  function () { clearTimeout(fallback); }, { once: true });
    window.addEventListener('visibilitychange', function () {
      if (document.hidden) clearTimeout(fallback);
    }, { once: true });
    window.location.href = schemeUrl;
  }

  function openPlatform(platformId) {
    var kw = input.value.trim();
    if (!kw) { input.focus(); toast('请输入搜索关键词'); return; }
    add(kw);
    var p = PLATFORMS[platformId] || PLATFORMS['xhs'];
    var scheme = p.scheme ? p.scheme(kw) : null;
    var web = p.web(kw);
    openAppOrWeb(scheme, web);
    toast('已打开 ' + p.name);
  }

  // ── 搜索动作（回车 / 点击放大镜）→ 跳转到 AI 推荐平台 ──
  function doSearch() {
    openPlatform(currentPlatform);
  }

  // ── 事件绑定 ──
  input.addEventListener('input', function() {
    toggleClear();
    debouncedClassify();
  });

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      doSearch();
    }
  });

  clearBtn.addEventListener('click', function() {
    input.value = '';
    input.focus();
    toggleClear();
    highlightPlatform('xhs');
  });

  searchIcon.addEventListener('click', function() {
    var kw = input.value.trim();
    if (!kw) { input.focus(); toast('请输入搜索关键词'); return; }
    doSearch();
  });

  historyClear.addEventListener('click', clearAll);

  appBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      openPlatform(btn.dataset.platform);
    });
  });

  // ── PWA 安装 ──
  if (isMobile() && !isPWA()) banner.style.display = 'block';

  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    banner.innerHTML = '👇 点击下方 <strong>安装</strong> 将此页变成独立 App';
    banner.style.display = 'block';
    banner.style.cursor = 'pointer';
    banner.onclick = function() { e.prompt(); e.userChoice.then(function() { banner.style.display = 'none'; }); };
  });

  window.addEventListener('appinstalled', function() { banner.style.display = 'none'; toast('安装成功！'); });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function() {});
  }

  render();
  toggleClear();
})();
</script>

</body>
</html>
