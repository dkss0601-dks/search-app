<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简聚合搜索</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #86868b;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --border: rgba(0,0,0,.06);
    --shadow-sm: 0 1px 3px rgba(0,0,0,.04);
    --shadow-md: 0 4px 20px rgba(0,0,0,.06);
    --radius: 16px;
    --radius-sm: 10px;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1d1f;
      --card-bg: #2d2d2f;
      --text: #f5f5f7;
      --text-secondary: #98989d;
      --accent: #2997ff;
      --accent-hover: #40a9ff;
      --border: rgba(255,255,255,.08);
      --shadow-sm: 0 1px 3px rgba(0,0,0,.2);
      --shadow-md: 0 4px 20px rgba(0,0,0,.3);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background var(--transition), color var(--transition);
    -webkit-font-smoothing: antialiased;
  }

  .container {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  /* ── 标题 ── */
  .brand {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.4px;
    background: linear-gradient(135deg, #0071e3 0%, #5e5ce6 50%, #af52de 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    user-select: none;
  }

  /* ── 搜索框 ── */
  .search-wrapper {
    width: 100%;
    position: relative;
  }

  .search-box {
    width: 100%;
    height: 52px;
    padding: 0 20px 0 48px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--card-bg);
    color: var(--text);
    font-size: 17px;
    outline: none;
    transition: all var(--transition);
    box-shadow: var(--shadow-sm);
  }

  .search-box::placeholder {
    color: var(--text-secondary);
  }

  .search-box:focus {
    border-color: var(--accent);
    box-shadow: var(--shadow-md), 0 0 0 4px rgba(0,113,227,.12);
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: var(--text-secondary);
    pointer-events: none;
  }

  .clear-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all var(--transition);
  }

  .clear-btn.visible { display: flex; }
  .clear-btn:hover { background: rgba(0,0,0,.1); color: var(--text); }

  /* ── 平台按钮 ── */
  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    width: 100%;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: all var(--transition);
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
    user-select: none;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: transparent;
  }

  .btn:active {
    transform: translateY(0) scale(0.97);
  }

  .btn-icon { font-size: 17px; line-height: 1; }

  .btn-xhs:hover  { background: #ff2442; color: #fff; }
  .btn-dy:hover   { background: #111;   color: #fff; }
  .btn-bili:hover { background: #fb7299; color: #fff; }
  .btn-bing:hover { background: #0078d4; color: #fff; }

  /* ── 搜索历史 ── */
  .history-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .history-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .history-clear {
    font-size: 12px;
    color: var(--text-secondary);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all var(--transition);
  }

  .history-clear:hover { color: #ff3b30; background: rgba(255,59,48,.08); }

  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .history-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    border-radius: 20px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    transition: all var(--transition);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .history-tag:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .history-tag .tag-icon {
    font-size: 12px;
    flex-shrink: 0;
    opacity: 0.5;
  }

  .empty-history {
    font-size: 13px;
    color: var(--text-secondary);
    text-align: center;
    padding: 16px 0;
    opacity: 0.6;
  }

  /* ── Footer ── */
  .footer {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    opacity: 0.5;
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    padding: 10px 22px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 999;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── 响应式 ── */
  @media (max-width: 480px) {
    body { padding: 20px 16px; justify-content: flex-start; padding-top: 80px; }
    .container { gap: 20px; }
    .brand { font-size: 24px; }
    .search-box { height: 48px; font-size: 16px; padding-left: 42px; }
    .btn { padding: 9px 14px; font-size: 13px; }
    .buttons { gap: 8px; }
    .history-tag { font-size: 12px; padding: 5px 10px; }
  }

  @media (min-width: 768px) {
    .brand { font-size: 32px; }
    .search-box { height: 56px; font-size: 18px; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- 品牌 -->
  <div class="brand">🔍 聚合搜索</div>

  <!-- 搜索框 -->
  <div class="search-wrapper">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      type="text"
      class="search-box"
      id="searchInput"
      placeholder="输入搜索关键词…"
      autofocus
    >
    <button class="clear-btn" id="clearBtn" title="清除">✕</button>
  </div>

  <!-- 按钮组 -->
  <div class="buttons">
    <button class="btn btn-xhs"   data-platform="xhs"  title="在小红书搜索">
      <span class="btn-icon">📕</span> 小红书
    </button>
    <button class="btn btn-dy"    data-platform="dy"   title="在抖音搜索">
      <span class="btn-icon">🎵</span> 抖音
    </button>
    <button class="btn btn-bili"  data-platform="bili" title="在B站搜索">
      <span class="btn-icon">📺</span> B站
    </button>
    <button class="btn btn-bing"  data-platform="bing" title="在必应搜索">
      <span class="btn-icon">🌐</span> 必应
    </button>
  </div>

  <!-- 搜索历史 -->
  <div class="history-section" id="historySection">
    <div class="history-header">
      <span class="history-title">🕐 最近搜索</span>
      <button class="history-clear" id="historyClear">清空全部</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="footer">回车搜索 · 点击标签回填 · 新标签页打开</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function () {
  const STORAGE_KEY = 'search_aggregator_history';
  const MAX_HISTORY = 10;

  // ── DOM ──
  const input    = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const historyList   = document.getElementById('historyList');
  const historyClear  = document.getElementById('historyClear');
  const historySection = document.getElementById('historySection');
  const toastEl = document.getElementById('toast');
  const buttons = document.querySelectorAll('.btn[data-platform]');

  // ── 搜索 URL 模板 ──
  const URLS = {
    xhs:  'https://www.xiaohongshu.com/search_result?keyword=',
    dy:   'https://www.douyin.com/search/',
    bili: 'https://search.bilibili.com/all?keyword=',
    bing: 'https://www.bing.com/search?q=',
  };

  // ── 历史管理 ──
  function loadHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch { return []; }
  }

  function saveHistory(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list.slice(0, MAX_HISTORY)));
  }

  function addHistory(keyword) {
    const kw = keyword.trim();
    if (!kw) return;
    let list = loadHistory();
    list = list.filter(item => item !== kw);
    list.unshift(kw);
    list = list.slice(0, MAX_HISTORY);
    saveHistory(list);
    renderHistory();
  }

  function clearAllHistory() {
    localStorage.removeItem(STORAGE_KEY);
    renderHistory();
    toast('历史已清空');
  }

  function renderHistory() {
    const list = loadHistory();
    historyList.innerHTML = '';

    if (list.length === 0) {
      historyList.innerHTML = '<div class="empty-history">暂无搜索记录</div>';
      return;
    }

    list.forEach(kw => {
      const tag = document.createElement('span');
      tag.className = 'history-tag';
      tag.innerHTML = `<span class="tag-icon">🕐</span>${escapeHTML(kw)}`;
      tag.title = kw;
      tag.addEventListener('click', () => {
        input.value = kw;
        input.focus();
        updateClearBtn();
      });
      historyList.appendChild(tag);
    });
  }

  // ── 工具函数 ──
  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._tid);
    toastEl._tid = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function updateClearBtn() {
    if (input.value.trim()) {
      clearBtn.classList.add('visible');
    } else {
      clearBtn.classList.remove('visible');
    }
  }

  // ── 搜索逻辑 ──
  function getKeyword() {
    return input.value.trim();
  }

  function search(platform) {
    const kw = getKeyword();
    if (!kw) {
      input.focus();
      toast('请输入搜索关键词');
      return;
    }

    // 记录历史
    addHistory(kw);

    const url = URLS[platform] + encodeURIComponent(kw);
    window.open(url, '_blank');
    const names = { xhs: '小红书', dy: '抖音', bili: 'B站', bing: '必应' };
    toast(`已在 ${names[platform]} 中搜索`);
  }

  // ── 事件绑定 ──
  input.addEventListener('input', updateClearBtn);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      // Enter 默认用第一个平台（小红书）搜索，也可以改成一键全搜
      search('bing');
    }
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    input.focus();
    updateClearBtn();
  });

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      search(btn.dataset.platform);
    });
  });

  historyClear.addEventListener('click', clearAllHistory);

  // 点击页面空白处取消选中（仅视觉）
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrapper') && !e.target.closest('.history-tag')) {
      input.blur();
    }
  });

  // ── 初始化 ──
  renderHistory();
  updateClearBtn();
})();
</script>

</body>
</html>
