<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, shrink-to-fit=no">
<!-- PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="聚合搜索">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f5f7">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<link rel="manifest" href="manifest.json">
<title>聚合搜索</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --sub: #86868b;
    --line: rgba(0,0,0,.06);
    --shadow: 0 1px 3px rgba(0,0,0,.04);
    --radius: 16px;
    --xhs: #ff2442;
    --dy:  #111;
    --bili:#fb7299;
    --web: #0078d4;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --sub: #98989d;
      --line: rgba(255,255,255,.08);
      --shadow: 0 1px 3px rgba(0,0,0,.3);
      --dy: #f5f5f7;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 24px) 16px env(safe-area-inset-bottom, 24px);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.3s, color 0.3s;
  }

  .container {
    width: 100%;
    max-width: 480px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ── 头部 ── */
  .header {
    text-align: center;
    padding-top: 16px;
  }

  .logo { font-size: 40px; margin-bottom: 8px; }

  .title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--sub);
    margin-top: 4px;
  }

  /* ── 搜索框 ── */
  .search-wrap { position: relative; }

  .search-input {
    width: 100%;
    height: 56px;
    padding: 0 56px 0 48px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--text);
    font-size: 18px;
    outline: none;
    transition: border 0.25s, box-shadow 0.25s;
    box-shadow: var(--shadow);
  }

  .search-input::placeholder { color: var(--sub); }

  .search-input:focus {
    border-color: #0071e3;
    box-shadow: 0 0 0 4px rgba(0,113,227,.12);
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    pointer-events: none;
  }

  .search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--line);
    color: var(--sub);
    font-size: 16px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }

  .search-clear.show { display: flex; }
  .search-clear:active { background: rgba(0,0,0,.15); }

  /* ── 大按钮组 ── */
  .app-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .app-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 64px;
    padding: 16px 20px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--card);
    cursor: pointer;
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: var(--shadow);
    -webkit-tap-highlight-color: transparent;
  }

  .app-btn:active {
    transform: scale(0.97);
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
  }

  .app-btn-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    color: #fff;
  }

  .icon-xhs  { background: var(--xhs); }
  .icon-dy   { background: var(--dy);  }
  .icon-bili { background: var(--bili);}
  .icon-web  { background: var(--web); }

  .app-btn-label {
    display: flex;
    flex-direction: column;
    text-align: left;
  }

  .app-btn-name {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.2;
  }

  .app-btn-hint {
    font-size: 12px;
    color: var(--sub);
    font-weight: 400;
  }

  .app-btn-arrow {
    margin-left: auto;
    color: var(--sub);
    font-size: 18px;
  }

  /* ── 安装横幅 ── */
  .install-banner {
    display: none;
    width: 100%;
    padding: 14px 16px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    text-align: center;
    font-size: 14px;
    color: var(--sub);
    line-height: 1.6;
  }

  .install-banner strong {
    color: #0071e3;
  }

  /* ── 历史 ── */
  .history {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .history-head span {
    font-size: 13px;
    font-weight: 600;
    color: var(--sub);
    letter-spacing: 0.5px;
  }

  .history-head button {
    font-size: 12px;
    color: var(--sub);
    background: none;
    border: none;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .history-head button:active { color: #ff3b30; }

  .history-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .history-tag {
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .history-tag:active {
    background: #0071e3;
    color: #fff;
    border-color: #0071e3;
  }

  .history-empty {
    font-size: 14px;
    color: var(--sub);
    text-align: center;
    padding: 12px 0;
    opacity: 0.5;
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--text);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── 底部 ── */
  .footer {
    text-align: center;
    font-size: 12px;
    color: var(--sub);
    opacity: 0.4;
    padding-top: 8px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">🔍</div>
    <div class="title">聚合搜索</div>
    <div class="subtitle">搜遍全网，一键直达</div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔎</span>
    <input
      type="text"
      class="search-input"
      id="searchInput"
      placeholder="输入关键词…"
      autofocus
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
    >
    <button class="search-clear" id="clearBtn">✕</button>
  </div>

  <!-- 安装提示 -->
  <div class="install-banner" id="installBanner">
    💡 点击浏览器 <strong>分享 → 添加到主屏幕</strong>，即可像 App 一样使用
  </div>

  <div class="app-buttons">
    <button class="app-btn" data-platform="xhs">
      <span class="app-btn-icon icon-xhs">📕</span>
      <span class="app-btn-label">
        <span class="app-btn-name">小红书</span>
        <span class="app-btn-hint">在 App 或网页中搜索</span>
      </span>
      <span class="app-btn-arrow">›</span>
    </button>

    <button class="app-btn" data-platform="dy">
      <span class="app-btn-icon icon-dy">🎵</span>
      <span class="app-btn-label">
        <span class="app-btn-name">抖音</span>
        <span class="app-btn-hint">在 App 或网页中搜索</span>
      </span>
      <span class="app-btn-arrow">›</span>
    </button>

    <button class="app-btn" data-platform="bili">
      <span class="app-btn-icon icon-bili">📺</span>
      <span class="app-btn-label">
        <span class="app-btn-name">哔哩哔哩</span>
        <span class="app-btn-hint">在 App 或网页中搜索</span>
      </span>
      <span class="app-btn-arrow">›</span>
    </button>

    <button class="app-btn" data-platform="bing">
      <span class="app-btn-icon icon-web">🌐</span>
      <span class="app-btn-label">
        <span class="app-btn-name">网页搜索</span>
        <span class="app-btn-hint">使用必应搜索</span>
      </span>
      <span class="app-btn-arrow">›</span>
    </button>
  </div>

  <div class="history">
    <div class="history-head">
      <span>🕐 最近搜索</span>
      <button id="historyClear">清空</button>
    </div>
    <div class="history-tags" id="historyList"></div>
  </div>

  <div class="footer">添加到主屏幕，像 App 一样使用</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const STORAGE_KEY = 'search_mobile_history';
  const MAX = 10;

  // ── DOM ──
  const input        = document.getElementById('searchInput');
  const clearBtn     = document.getElementById('clearBtn');
  const historyList  = document.getElementById('historyList');
  const historyClear = document.getElementById('historyClear');
  const installBanner= document.getElementById('installBanner');
  const toastEl      = document.getElementById('toast');

  // ── 平台：直接使用 https 链接 ──
  // 手机端会通过 Universal Link / App Link 自动唤起 App
  // 若未安装 App 则在浏览器中打开网页版
  const PLATFORMS = {
    xhs:  { name: '小红书',   url: kw => `https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(kw)}&source=web_search_result_notes` },
    dy:   { name: '抖音',     url: kw => `https://www.douyin.com/search/${encodeURIComponent(kw)}` },
    bili: { name: '哔哩哔哩', url: kw => `https://search.bilibili.com/all?keyword=${encodeURIComponent(kw)}` },
    bing: { name: '必应',     url: kw => `https://www.bing.com/search?q=${encodeURIComponent(kw)}` },
  };

  // ── 历史管理 ──
  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function save(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list.slice(0, MAX)));
  }

  function add(kw) {
    const word = kw.trim();
    if (!word) return;
    let list = load();
    list = list.filter(v => v !== word);
    list.unshift(word);
    save(list);
    render();
  }

  function clearAll() {
    localStorage.removeItem(STORAGE_KEY);
    render();
    toast('历史已清空');
  }

  function render() {
    const list = load();
    historyList.innerHTML = '';
    if (!list.length) {
      historyList.innerHTML = '<div class="history-empty">暂无搜索记录</div>';
      return;
    }
    list.forEach(kw => {
      const tag = document.createElement('span');
      tag.className = 'history-tag';
      tag.textContent = kw;
      tag.addEventListener('click', () => {
        input.value = kw;
        input.focus();
        toggleClear();
      });
      historyList.appendChild(tag);
    });
  }

  // ── 工具 ──
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._tid);
    toastEl._tid = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function toggleClear() {
    clearBtn.classList.toggle('show', !!input.value.trim());
  }

  // ── 搜索 ──
  function openPlatform(platformId) {
    const kw = input.value.trim();
    if (!kw) {
      input.focus();
      toast('请输入搜索关键词');
      return;
    }

    add(kw);
    const p = PLATFORMS[platformId];
    const url = p.url(kw);

    // 直接用 https 链接打开
    // 手机端若安装了 App 且支持 Universal Link / App Link，会自动唤起 App
    window.open(url, '_blank');
    toast(`已打开 ${p.name}`);
  }

  // ── 事件 ──
  input.addEventListener('input', toggleClear);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      openPlatform('xhs');
    }
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    input.focus();
    toggleClear();
  });

  document.querySelectorAll('.app-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      openPlatform(btn.dataset.platform);
    });
  });

  historyClear.addEventListener('click', clearAll);

  // ── PWA 安装提示 ──
  // 仅在 Safari / Chrome 移动端显示
  function showInstallHint() {
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                      || navigator.standalone;
    if (isMobile && !isStandalone) {
      installBanner.style.display = 'block';
    }
  }

  // 监听 PWA beforeinstallprompt（Chrome）
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBanner.innerHTML = '👇 点击下方 <strong>安装</strong> 将此页变成独立 App';
    installBanner.style.display = 'block';
    installBanner.style.cursor = 'pointer';
    installBanner.addEventListener('click', () => {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(result => {
        installBanner.style.display = 'none';
      });
    });
  });

  window.addEventListener('appinstalled', () => {
    installBanner.style.display = 'none';
    toast('安装成功！');
  });

  // 注册 Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // ── 初始化 ──
  render();
  toggleClear();
  showInstallHint();
})();
</script>

</body>
</html>
